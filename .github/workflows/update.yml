name: Update NerChat Element Call
on:
  workflow_dispatch:
  schedule:
    - cron: '43 19 * * *'
permissions:
  contents: write
concurrency:
  group: nerchat-element-call-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/prepare.py
      - id: check
        run: |
          if cmp -s .work/release.json deployed-release.json && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.changed == 'true'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.changed == 'true'
        run: |
          python3 scripts/verify.py
          ./node_modules/.bin/edgeone validate
      - if: steps.check.outputs.changed == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          node scripts/deploy.mjs preview
          python3 scripts/verify.py preview
          node scripts/deploy.mjs production
          python3 scripts/verify.py production
      - if: steps.check.outputs.changed == 'true'
        run: |
          cp .work/release.json deployed-release.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployed-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record verified Element Call deployment'
            git push
          fi
